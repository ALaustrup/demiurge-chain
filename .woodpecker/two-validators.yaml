# chain/: two validators agree, finalise, and a killed one catches up.
# Criterion alpha.multi-validator in docs/GATES.toml reads this, and it FAILS the
# pipeline: two validators disagreeing, failing to finalise, or a restarted one
# never catching up, is a chain that forks.
#
# The former `two-validators` job of .github/workflows/ci.yml (ADR-058). Nightly
# and on demand, not on every push: it builds the node in RELEASE with the `sudo`
# feature, which is the expensive part, for a check whose subject changes rarely.
# After touching consensus, run it by hand rather than waiting for the night.
#
# The nightly run is a cron named "nightly", created once in Woodpecker's
# repository settings (infra/woodpecker/README.md).

when:
  - event: cron
    cron: nightly
  - event: manual

steps:
  - name: build the node, run two validators
    image: rust:1-bookworm
    environment:
      CARGO_TERM_COLOR: always
      RUST_BACKTRACE: "1"
      CARGO_TARGET_DIR: /cache/target
    volumes:
      - qor-ci-cargo-registry:/usr/local/cargo/registry
      - qor-ci-cargo-git:/usr/local/cargo/git
      # The release artifacts, which the debug cache should not carry.
      - qor-ci-two-validators-target:/cache/target
    commands:
      # Node 18 or newer: the script needs fetch and AbortSignal.timeout.
      - apt-get -o Acquire::Retries=5 update && apt-get -o Acquire::Retries=5 install -y clang libclang-dev llvm-dev protobuf-compiler nodejs
      - rustup target add wasm32v1-none
      - cd chain
      # `sudo` is the development and test feature (ADR-037).
      - cargo build -p demiurge-node --release --features sudo --locked
      # The binary is under CARGO_TARGET_DIR, not chain/target where the script looks by default.
      - DEMIURGE_NODE=/cache/target/release/demiurge-node node scripts/check-two-validators.mjs
