# chain/: format, lints and tests. The Substrate L1 (ADR-013), and a quality gate.
#
# Woodpecker CI replaced GitHub Actions on 2026-09-28 (ADR-058). This is the
# former `chain` job of .github/workflows/ci.yml, command for command.
#
# Deliberately NOT SKIP_WASM_BUILD: that variable leaves the runtime wasm unbuilt,
# so a chain specification cannot be built and two tests fail that have nothing
# wrong with them. A suite run under it is not evidence (AGENTS.md section 8).
#
# Caches are named Docker volumes on the agent's machine, so the repository must
# be marked Trusted (volumes) in Woodpecker's settings; infra/woodpecker/README.md.

when:
  - event: push
    branch: [main, develop]
  - event: pull_request
    branch: main
  - event: manual

steps:
  - name: format, lints, tests
    image: rust:1-bookworm
    environment:
      CARGO_TERM_COLOR: always
      RUST_BACKTRACE: "1"
      CARGO_TARGET_DIR: /cache/target
    volumes:
      - qor-ci-cargo-registry:/usr/local/cargo/registry
      - qor-ci-cargo-git:/usr/local/cargo/git
      - qor-ci-chain-target:/cache/target
    commands:
      - apt-get -o Acquire::Retries=5 update && apt-get -o Acquire::Retries=5 install -y clang libclang-dev llvm-dev protobuf-compiler
      - rustup component add rustfmt clippy
      # The runtime's wasm. The SDK prefers this target over wasm32-unknown-unknown.
      - rustup target add wasm32v1-none
      - cd chain
      - cargo fmt --all --check
      - cargo clippy --workspace --all-targets --locked -- -D warnings
      - cargo test --workspace --locked
