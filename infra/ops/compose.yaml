# The operations stack, on the owner's computer, published by a Cloudflare Tunnel
# (ADR-060).
#
#   https://id.qorsync.dev   QOR ID's API          -> qor-auth:8080
#   https://ci.qorsync.dev   Woodpecker CI's UI    -> woodpecker-server:8000
#                            and GitHub's webhooks
#
# cloudflared connects OUT to Cloudflare, which serves those names over HTTPS and
# forwards requests down the tunnel. No port on this computer is opened to the
# internet, and none is published to the host: the services talk on this stack's
# own network, so they never collide with start-local.ps1's development stack.
# The Woodpecker agent is here too and reaches the server on that network.
#
# Not here yet: a public chain RPC node. A --dev chain's sudo key is the
# well-known //Alice, so anyone reaching it could take the chain over. It is added
# once chain/ has a test specification with a private sudo key (ADR-060).
#
# Secrets live in %LOCALAPPDATA%\qor-ops\.env, outside the repository, made and
# read by start-ops.ps1. Start or update:  powershell -File infra/ops/start-ops.ps1

name: qor-ops

services:
  # The tunnel's name, routes and credentials are made by `cloudflared tunnel
  # create` on this computer and kept in %LOCALAPPDATA%\qor-ops\cloudflared, with
  # config.yml mapping each name to its service (start-ops.ps1 writes it).
  cloudflared:
    image: cloudflare/cloudflared:latest
    restart: unless-stopped
    command: ["tunnel", "--no-autoupdate", "--config", "/etc/cloudflared/config.yml", "run"]
    volumes:
      - ${QOR_OPS_DIR:?}/cloudflared:/etc/cloudflared:ro

  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: qor
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?}
      POSTGRES_DB: qor_auth
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "qor", "-d", "qor_auth"]
      interval: 5s
      retries: 30

  redis:
    image: redis:7.4-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redisdata:/data

  qor-auth:
    build: ../../services/qor-auth
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
    environment:
      RUN_ENV: production
      QOR_AUTH__SERVER__PORT: "8080"
      DATABASE_URL: postgres://qor:${POSTGRES_PASSWORD}@postgres:5432/qor_auth
      REDIS_URL: redis://redis:6379
      JWT_ACCESS_SECRET: ${JWT_ACCESS_SECRET:?}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET:?}
      # No email service yet: QOR ID refuses email flows and says so. Sign-up by
      # vault key needs none.

  woodpecker-server:
    image: woodpeckerci/woodpecker-server:v3
    restart: unless-stopped
    environment:
      WOODPECKER_HOST: https://ci.qorsync.dev
      WOODPECKER_SERVER_ADDR: ":8000"
      WOODPECKER_GRPC_ADDR: ":9000"
      WOODPECKER_GITHUB: "true"
      WOODPECKER_GITHUB_CLIENT: ${WOODPECKER_GITHUB_CLIENT:?}
      WOODPECKER_GITHUB_SECRET: ${WOODPECKER_GITHUB_SECRET:?}
      WOODPECKER_AGENT_SECRET: ${WOODPECKER_AGENT_SECRET:?}
      # Only the owner signs in; nobody else can register.
      WOODPECKER_OPEN: "false"
      WOODPECKER_ADMIN: ALaustrup
    volumes:
      - woodpecker-data:/var/lib/woodpecker

  # Runs each pipeline's steps as Docker containers on this computer.
  woodpecker-agent:
    image: woodpeckerci/woodpecker-agent:v3
    restart: unless-stopped
    depends_on:
      - woodpecker-server
    environment:
      WOODPECKER_SERVER: woodpecker-server:9000
      WOODPECKER_AGENT_SECRET: ${WOODPECKER_AGENT_SECRET:?}
      WOODPECKER_BACKEND: docker
      # Two pipelines at once: a chain build uses most of this machine.
      WOODPECKER_MAX_WORKFLOWS: "2"
      WOODPECKER_HOSTNAME: owner-pc
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - woodpecker-agent-config:/etc/woodpecker

volumes:
  pgdata:
  redisdata:
  woodpecker-data:
  woodpecker-agent-config:
