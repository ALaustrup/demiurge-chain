# Nginx configuration for Demiurge RPC Load Balancer
# Distributes RPC requests across testnet nodes

worker_processes auto;
error_log /var/log/nginx/error.log warn;
pid /tmp/nginx.pid;

events {
    worker_connections 1024;
    use epoll;
    multi_accept on;
}

http {
    # Basic settings
    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 65;
    types_hash_max_size 2048;

    # Logging
    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent" "$http_x_forwarded_for" '
                    'upstream: $upstream_addr';

    access_log /var/log/nginx/access.log main;

    # Upstream RPC nodes
    upstream rpc_nodes {
        least_conn;
        
        server 172.28.0.11:9944 weight=5;  # node1 - primary
        server 172.28.0.12:9944 weight=3;  # node2
        server 172.28.0.13:9944 weight=3;  # node3
        server 172.28.0.14:9944 weight=3;  # node4
        
        keepalive 32;
    }

    # WebSocket upstream (sticky sessions for subscriptions)
    upstream ws_nodes {
        ip_hash;  # Sticky sessions for WebSocket
        
        server 172.28.0.11:9944;
        server 172.28.0.12:9944;
        server 172.28.0.13:9944;
        server 172.28.0.14:9944;
    }

    # Rate limiting
    limit_req_zone $binary_remote_addr zone=rpc_limit:10m rate=100r/s;
    limit_conn_zone $binary_remote_addr zone=conn_limit:10m;

    server {
        listen 80;
        server_name _;

        # Health check endpoint
        location /health {
            access_log off;
            return 200 'OK';
            add_header Content-Type text/plain;
        }

        # RPC endpoint
        location / {
            # Rate limiting
            limit_req zone=rpc_limit burst=50 nodelay;
            limit_conn conn_limit 10;

            # CORS headers
            add_header 'Access-Control-Allow-Origin' '*' always;
            add_header 'Access-Control-Allow-Methods' 'GET, POST, OPTIONS' always;
            add_header 'Access-Control-Allow-Headers' 'Content-Type, Authorization' always;

            if ($request_method = 'OPTIONS') {
                return 204;
            }

            # Check for WebSocket upgrade
            set $upstream rpc_nodes;
            if ($http_upgrade = "websocket") {
                set $upstream ws_nodes;
            }

            # Proxy settings
            proxy_pass http://$upstream;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            # WebSocket support
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";

            # Timeouts
            proxy_connect_timeout 5s;
            proxy_send_timeout 60s;
            proxy_read_timeout 60s;

            # Buffer settings
            proxy_buffering on;
            proxy_buffer_size 8k;
            proxy_buffers 16 8k;
        }
    }
}
