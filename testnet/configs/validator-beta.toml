# Validator Beta - Secondary Node
# Port: 9945 (RPC), 9934 (WebSocket), 30334 (P2P)

[node]
name = "Validator-Beta"
role = "Authority"
base_path = "/var/lib/demiurge/validator-beta"

[network]
listen_addresses = [
    "/ip4/0.0.0.0/tcp/30334",
    "/ip6/::/tcp/30334"
]
public_addresses = [
    "/ip4/51.210.209.112/tcp/30334"
]
bootnodes = [
    "/ip4/51.210.209.112/tcp/30333/p2p/12D3KooWEyoppNCUx8Yx66oV9fJnriXwCcXwDDUA2kj6vnc6iDEp"
]
enable_mdns = true

[rpc]
port = 9945
methods = ["Safe"]
cors = ["*"]
max_connections = 100

[ws]
port = 9934
max_connections = 100

[telemetry]
enabled = false

[validator]
account = "5FHneW46xGXgs5mUiveU4sbTyGBzmstUspZC92UhjJM694ty"
enable = true

[consensus]
block_time_ms = 2000
era_length = 1000

[pruning]
mode = "Constrained"  # Keep last 256 blocks
blocks_pruning = 256

[logging]
level = "info,demiurge_consensus=debug"
