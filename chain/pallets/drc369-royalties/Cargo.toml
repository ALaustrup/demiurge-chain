[package]
name = "pallet-drc369-royalties"
description = "DRC-369 royalties and remix royalties, bound to the one kind of sale a chain can see: a listing bought and settled in CGT on chain (ADR-047, ADR-061)."
authors.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
version.workspace = true

[lints.rust]
unsafe_code = "forbid"

[dependencies]
codec = { workspace = true }
scale-info = { workspace = true }

# `pallet-drc369` says what an asset is and what it was derived from;
# `pallet-nfts` says who holds it and moves it (ADR-025).
pallet-drc369 = { workspace = true }
polkadot-sdk = { workspace = true, features = [
  "runtime",
  "pallet-nfts",
] }

[dev-dependencies]
polkadot-sdk = { workspace = true, features = [
  "std",
  "runtime",
  "pallet-balances",
  "pallet-nfts",
] }

[features]
default = ["std"]
std = [
  "codec/std",
  "pallet-drc369/std",
  "polkadot-sdk/std",
  "scale-info/std",
]
runtime-benchmarks = [
  "pallet-drc369/runtime-benchmarks",
  "polkadot-sdk/runtime-benchmarks",
]
try-runtime = [
  "pallet-drc369/try-runtime",
  "polkadot-sdk/try-runtime",
]
